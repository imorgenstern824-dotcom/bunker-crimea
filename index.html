<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Тихая Бухта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=Russo+One&display=swap">
<style>
/* Layout: one phone-width column. HUD on top, bunker cut-away as the stage, advisor and two big buttons under it, notebook tabs at the bottom. Single dark look on purpose: concrete, sodium-lamp amber, civil-defence signage. */
:root{
  --ground:#101417; --shaft:#161c20; --concrete:#222b31; --line:#33404a;
  --amber:#f2b134; --amber-hi:#f8d36a; --signal:#e0533a; --moss:#86b567; --steel:#78a0b8;
  --text:#ebe6d8; --muted:#8f9ba4; --paper:#ece4cf; --ink:#1c1a16; --margin:#c4584a;
  --f-display:'Russo One','Arial Narrow',Impact,sans-serif;
  --f-body:'Golos Text','Segoe UI',system-ui,sans-serif;
  --f-hand:'Caveat','Segoe Print',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber-hi);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-block:10px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}

/* title bar */
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.titlebar h1{margin:0;font:400 20px/1.1 var(--f-display);letter-spacing:.02em}
.titlebar p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.round{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#0d1114;display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.round.off svg{opacity:.4}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:58px;z-index:20;background:#0d1114;border:2px solid var(--line);border-radius:14px;padding:6px;display:grid;gap:4px;min-width:210px}
.menu button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:9px;font-size:14px}
.menu button:hover{background:var(--concrete)}
.menu .danger{color:var(--signal)}

/* HUD */
.pills{display:grid;grid-template-columns:1fr 1.05fr 1.2fr 46px;gap:8px;margin-top:12px}
.pill{background:#0d1114;border:2px solid var(--line);border-radius:16px;padding:8px 10px;min-width:0}
.pill span{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pill b{display:block;font:400 25px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.p-time{border-color:#8a5a2a}.p-time b{color:var(--amber-hi)}
.p-pop{border-color:#3f6a4a}.p-pop b{color:#9bd07a}
.p-scrap{border-color:#8a7226}.p-scrap b{color:#f7d66a}
.pills .round{width:46px;height:auto;border-radius:16px}
.row2{display:flex;align-items:center;gap:10px;margin-top:8px}
.speed{border:2px solid var(--amber);background:#0d1114;color:var(--amber-hi);border-radius:14px;padding:7px 14px;font:400 15px var(--f-display);min-width:64px}
.daytxt{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood{display:flex;align-items:center;gap:6px;background:#0d1114;border:2px solid var(--line);border-radius:14px;padding:6px 12px;font:400 15px var(--f-display)}
.mood i{width:12px;height:12px;border-radius:50%;background:var(--moss);display:block}
.mood small{font:500 11px var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.m{background:#0d1114;border:2px solid var(--line);border-radius:14px;padding:7px 9px 8px;min-width:0}
.m .mt{display:flex;justify-content:space-between;gap:4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.m em{font-style:normal;font-weight:600;letter-spacing:0}
.m em.pos{color:var(--moss)}.m em.neg{color:var(--signal)}
.m b{display:block;font:400 18px/1.25 var(--f-display);font-variant-numeric:tabular-nums}
.mb{height:5px;border-radius:3px;background:#222a30;margin-top:4px;overflow:hidden}
.mb i{display:block;height:100%;background:var(--steel);border-radius:3px}
.m.food .mb i{background:var(--moss)}.m.power .mb i{background:var(--amber)}.m.rad .mb i{background:#b9c47a}
.m.bad{border-color:var(--signal)}.m.bad .mb i{background:var(--signal)}
.m.bad .mt span{color:var(--signal)}
.prog{height:4px;border-radius:2px;background:#222a30;margin-top:10px;overflow:hidden}
.prog b{display:block;height:100%;width:0;background:var(--amber)}

/* scene */
.scene{position:relative;margin-top:10px;border-radius:18px;overflow:hidden;background:var(--shaft);border:2px solid #0a0c0e}
.sky{position:relative;height:96px}
.sky svg{display:block;width:100%;height:100%}
.ash{position:absolute;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(1.4px 1.4px at 12% 20%,#fff9,transparent 60%),radial-gradient(1.2px 1.2px at 47% 60%,#fff8,transparent 60%),radial-gradient(1.6px 1.6px at 78% 35%,#fff9,transparent 60%),radial-gradient(1px 1px at 30% 85%,#fff7,transparent 60%);background-size:170px 170px;animation:ash 9s linear infinite}
@keyframes ash{to{background-position:-40px 170px}}
#mast.on{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.shaft{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:repeating-linear-gradient(90deg,#1b2227 0 6px,#171d21 6px 12px)}
.room{position:relative;height:64px;min-width:0;border:0;border-radius:7px;text-align:left;padding:7px 8px 6px 46px;overflow:hidden;background:#1a2025}
.room .ico{position:absolute;left:10px;top:50%;width:28px;height:28px;margin-top:-14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.room .nm{display:block;font-size:12.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .st{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
.room .pips{display:flex;gap:3px;margin-top:5px}
.room .pips i{width:10px;height:4px;border-radius:1px;background:#33404a}
.room .pips i.f{background:var(--amber)}
.room.on{background:linear-gradient(180deg,#3b301b,#241f19);box-shadow:inset 0 0 0 1px #f2b13455,inset 0 -20px 26px -16px #f2b13466;color:var(--text)}
.room.on .ico{color:var(--amber-hi)}
.room.ruined{color:#6a7782;background:#13171a repeating-linear-gradient(135deg,transparent 0 9px,#7a5c3a40 9px 12px)}
.room.ruined .ico{color:#4a5560}
.room.building{background:#1f1b15;color:var(--text)}
.room.building .ico{color:#d9a24a}
.room.fixed{background:linear-gradient(180deg,#22323d,#182229);color:var(--text)}
.room.fixed .ico{color:var(--steel)}
.room.sel{outline:2px solid var(--amber-hi);outline-offset:-2px}
.tape{position:absolute;left:0;right:0;bottom:0;height:15px;font:400 9px/15px var(--f-display);letter-spacing:.14em;color:var(--ink);text-align:center;background:linear-gradient(90deg,var(--amber) var(--p),#6d5115 var(--p))}
.walker{position:absolute;width:22px;height:34px;z-index:3;pointer-events:none;transition:left .55s ease,top .55s ease}
.walker svg{display:block;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.detail{margin:10px 2px 0;font-size:13px;color:var(--muted)}
.detail b{color:var(--text)}

/* advisor */
.advisor{display:flex;align-items:center;gap:10px;margin-top:10px;background:#0d1114;border:2px solid var(--line);border-radius:20px;padding:10px}
.av{display:block;border-radius:50%;flex:none;border:2px solid #3b4650}
.bubble{flex:1;min-width:0;background:#fbf7ec;color:var(--ink);border-radius:14px;padding:10px 13px;font-size:15.5px;line-height:1.3}
.bubble b{color:#b03a22}
.bubble .red{color:#b03a22}

/* actions */
.actions{display:grid;grid-template-columns:1fr 1.15fr;gap:10px;margin-top:10px}
.big{border:0;border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;justify-content:center;min-height:68px}
.big b{font:400 21px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.big small{font-size:13px;margin-top:2px}
.collect{background:#48584d;color:#e6efe4;box-shadow:0 4px 0 #2c372f}
.collect small{color:#b8c9b6}
.upg{background:#f6d160;color:var(--ink);box-shadow:0 4px 0 #a98a22}
.upg small{color:#4d4220}
.big:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:7px;background:#0d1114;border:2px solid var(--line);border-radius:14px;padding:6px 11px;font-size:13px;white-space:nowrap}
.chip i{width:11px;height:11px;border-radius:3px;display:block}

/* tabs and notebook */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:16px}
.tab{position:relative;border:0;background:var(--concrete);color:var(--muted);border-radius:12px 12px 0 0;padding:11px 2px;font-size:13px;font-weight:600}
.tab.act{background:var(--amber);color:var(--ink)}
.tab .bd{position:absolute;top:-6px;right:6px;min-width:20px;height:20px;border-radius:10px;background:var(--signal);color:#fff;font-size:11px;line-height:20px;text-align:center;padding:0 5px}
.book{position:relative;background:var(--paper);color:var(--ink);border-radius:0 0 16px 16px;padding:16px 16px 20px 46px;min-height:220px}
.book::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:var(--margin)}
.book h3{margin:0 0 6px;font:400 17px/1.2 var(--f-display)}
.entry{margin:0;padding:6px 0;border-bottom:1px dashed #b9ae92;font:500 21px/1.15 var(--f-hand)}
.entry .dn{display:inline-block;margin-right:6px;font:700 13px var(--f-body);color:#8a3a2a;letter-spacing:.04em;text-transform:uppercase}
.goals{list-style:none;margin:0;padding:0}
.goals li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #b9ae92;font-size:14.5px}
.goals .ck{flex:none;width:22px;height:22px;border:2px solid #7d745e;border-radius:6px;display:grid;place-items:center;font-weight:700;color:#2f6a2a}
.goals .done{color:#6b6450}.goals .done .t{text-decoration:line-through}
.goals .cur{background:#f6e6a8;margin:0 -8px;padding:8px}
.goals small{display:block;color:#5b5546;font-size:12.5px}
.sortie{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed #b9ae92;align-items:center}
.sortie b{font-weight:700}
.sortie small{color:#5b5546;font-size:12.5px;grid-column:1}
.risk-l{color:#3f6b2e}.risk-m{color:#8e6210}.risk-h{color:#a5321f}
.sbtn{grid-column:2;grid-row:1/4;background:var(--ink);color:var(--paper);border:0;border-radius:11px;padding:10px 13px;font-size:13px;font-weight:600;max-width:120px}
.sbtn:disabled{opacity:.3;cursor:default}
.sortie.act{background:#e3d9bd;margin:0 -8px;padding:10px 8px}
.crew{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #b9ae92}
.crew .av{border-color:#7d745e}
.crew b{display:block}
.crew small{color:#5b5546;font-size:12.5px;display:block}
.sum{margin:0 0 8px;font-size:14px}
.empty{margin:0;color:#5b5546}

/* event sheet */
.sheet{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:520px;background:#12171b;border-top:3px solid var(--amber);border-radius:22px 22px 0 0;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:90%;overflow-y:auto}
.who{display:flex;align-items:center;gap:12px}
.who b{display:block;font:400 17px/1.2 var(--f-display)}
.who small{color:var(--muted);font-size:12.5px}
.ttl{margin:14px 0 4px;font:400 19px/1.2 var(--f-display);color:var(--amber-hi);text-wrap:balance}
.say{margin:0 0 12px;font-size:16px;line-height:1.4}
.res{margin:14px 0;font-size:16px;line-height:1.4;background:#1d252b;border-radius:12px;padding:12px 14px}
.ch{display:block;width:100%;text-align:left;border:2px solid #3a4651;background:#1b232a;border-radius:14px;padding:12px 14px;margin-top:8px}
.ch b{display:block;font-size:15.5px}
.ch small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ch:hover:not(:disabled){border-color:var(--amber)}
.ch:disabled{opacity:.4;cursor:default}
.ch.go{background:var(--amber);color:var(--ink);border-color:var(--amber);text-align:center}

/* end screen */
.end{position:fixed;inset:0;z-index:60;background:#0b0e10f2;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));overflow-y:auto}
.end-card{max-width:420px;text-align:center}
.end-card h2{margin:0 0 10px;font:400 30px/1.1 var(--f-display);color:var(--amber-hi);text-wrap:balance}
.end-card p{margin:0 0 12px;font-size:16px;line-height:1.4}
.stars{font-size:30px;color:var(--amber);letter-spacing:.2em;margin-bottom:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.stats div{background:#161c20;border:2px solid var(--line);border-radius:14px;padding:10px}
.stats b{display:block;font:400 22px var(--f-display)}
.stats span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

@media (max-width:370px){.pill b{font-size:22px}.m b{font-size:16px}.big b{font-size:18px}}
@media (prefers-reduced-motion:reduce){.ash,.walker svg,#mast.on{animation:none}.walker{transition:none}}
</style>

</head>

<div class="app">
  <div class="titlebar">
    <div><h1>Тихая Бухта</h1><p>бункер под Балаклавой · Крым · после катастрофы</p></div>
    <button class="round" id="menuBtn" aria-label="Меню"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
  </div>
  <div class="menu" id="menu" hidden>
    <button id="mSnd">Звук: выкл</button>
    <button id="mNew" class="danger">Начать заново</button>
  </div>

  <div class="pills">
    <div class="pill p-time"><span>Срок, дн.</span><b id="vDays">364</b></div>
    <div class="pill p-pop"><span>Выжившие</span><b id="vPop">3/6</b></div>
    <div class="pill p-scrap"><span>Лом</span><b id="vScrap">300</b></div>
    <button class="round off" id="sndBtn" aria-label="Звук"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
  </div>
  <div class="row2">
    <button class="speed" id="spd">x1</button>
    <div class="daytxt" id="dayTxt">День 1</div>
    <div class="mood"><i id="moodDot"></i><b id="vMood">60</b><small>дух</small></div>
  </div>
  <div class="meters" id="meters"></div>
  <div class="prog"><b id="prog"></b></div>

  <section class="scene" id="scene">
    <div class="sky">
      <svg viewBox="0 0 400 96" preserveAspectRatio="xMidYMax slice" aria-hidden="true">

        <rect width="400" height="96" fill="url(#sg)"/>
        <circle cx="86" cy="56" r="28" fill="#e9a24d" opacity=".3"/><circle cx="86" cy="56" r="13" fill="#f2b45f" opacity=".55"/>
        <path d="M0 74 L40 58 L78 66 L130 40 L172 40 L214 48 L262 70 L320 52 L360 64 L400 56 V96 H0z" fill="#2a2523"/>

        <path d="M22 88 q-5-20 0-34 q5 14 0 34z" fill="#0d110e"/><path d="M40 90 q-4-14 0-24 q4 10 0 24z" fill="#0d110e"/><path d="M360 88 q-5-18 0-30 q5 12 0 30z" fill="#0d110e"/>
        <path d="M232 90 V56 M227 90 h10 M229 70 h6 M230 62 h4" stroke="#0e0e0f" stroke-width="2" fill="none"/>
        <circle id="mast" cx="232" cy="53" r="2.6" fill="#e0533a"/>
        <rect y="90" width="400" height="6" fill="#1a1d1f"/>
      </svg>
      <div class="ash"></div>
    </div>
    <div class="shaft" id="rooms"></div>
    <div class="walker" id="walker">
      <svg viewBox="0 0 22 34" width="22" height="34" aria-hidden="true">
        <rect x="2" y="14" width="3" height="9" rx="1.5" fill="#d97a1f"/><rect x="17" y="14" width="3" height="9" rx="1.5" fill="#d97a1f"/>
        <rect x="4" y="12" width="14" height="14" rx="4" fill="#f08a2b"/>
        <rect x="6" y="26" width="4" height="8" fill="#1b1f22"/><rect x="12" y="26" width="4" height="8" fill="#1b1f22"/>
        <circle cx="11" cy="6.5" r="5" fill="#e2b894"/><path d="M5.5 5a5.5 5 0 0 1 11 0z" fill="#f2b134"/>

  <div class="tabs" id="tabs"></div>
  <div class="book" id="book"></div>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>

<script>

/* ---------- state ---------- */
function fresh(){return{v:1,day:1,t:0,speed:1,pop:3,away:0,
  res:{food:120,water:120,power:90,scrap:300},pile:0,morale:60,rad:10,
  lv:{radio:0,arms:0,air:0,home:1,med:0,farm:0,water:1,gen:1,store:1},
  build:[],sorties:[],crew:['tamara'],flags:{},last:{},log:[{d:1,t:'Бункер «Тихая Бухта» запущен. Нас трое.'}],
  sel:'air',ended:null,ev:'intro',stats:{sorties:0,lost:0},snd:false}}
function load(){try{const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);if(o&&o.v===1&&o.lv){if(o.ev&&!EVENTS.find(e=>e.id===o.ev))o.ev=null;return o}}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- helpers ---------- */
const cap=()=>CAP[S.lv.home];
const stor=()=>200+150*S.lv.store;
const has=id=>S.crew.includes(id);
const slots=()=>1+(S.lv.home>=2?1:0)+(S.lv.store>=3?1:0);
const cost=id=>Math.round(COST[S.lv[id]]*RM[id].k/10)*10;
const genOut=()=>GEN[S.lv.gen]*(has('mikhalych')?1.2:1);
const powerUse=()=>3+ROOMS.reduce((a,r)=>a+(r.fixed?0:r.use*S.lv[r.id]),0);
const eff=()=>(S.res.power>0?1:.35)*(S.morale<20?.6:1);
const radDelta=()=>2.5-(S.lv.air>0?(S.res.power>0?1:.4)*(1.4*S.lv.air+.5):0);
const net=()=>({food:FARM[S.lv.farm]*eff()-S.pop*1.2,water:WAT[S.lv.water]*eff()-S.pop*1.6,power:genOut()-powerUse(),rad:radDelta()});
const log=t=>{S.log.unshift({d:S.day,t});if(S.log.length>80)S.log.length=80};
const mor=v=>{S.morale=clamp(S.morale+v,0,100)};
function res(k,v){S.res[k]=Math.max(0,S.res[k]+v);if(k!=='scrap')S.res[k]=Math.min(S.res[k],stor())}
function join(n){const k=Math.max(0,Math.min(n,cap()-S.pop));S.pop+=k;return k}
function lose(k,why){k=Math.min(k,S.pop);if(k<=0)return 0;S.pop-=k;S.stats.lost+=k;S.away=clamp(S.away,0,Math.max(0,S.pop-1));log(`Потеряли ${k} ${man(k)}: ${why}.`);return k}
const curGoal=()=>{const i=GOALS.findIndex(g=>!g.ok());return i<0?GOALS.length-1:i};

let S=load(), tab='journal', evRes=null, confirmNew=false, audio=null;

function snd(f){if(!S.snd)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.05;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.18);o.stop(audio.currentTime+.2)}catch(e){}}

function endDay(){
  const e=eff(),R=S.res,L=S.lv;
  R.power+=genOut()-powerUse();
  const blackout=R.power<=0;if(R.power<0)R.power=0;R.power=Math.min(R.power,stor());
  if(blackout&&!S.flags.bo){S.flags.bo=1;log('Свет погас. Модули работают вполсилы.')}
  if(!blackout)S.flags.bo=0;
  R.food+=FARM[L.farm]*e-S.pop*1.2;R.water+=WAT[L.water]*e-S.pop*1.6;
  let hungry=false,thirsty=false;
  if(R.food<0){R.food=0;hungry=true}if(R.water<0){R.water=0;thirsty=true}
  R.food=Math.min(R.food,stor());R.water=Math.min(R.water,stor());
  if(hungry||thirsty){lose(Math.max(1,Math.floor(S.pop*.1)),hungry?'голод':'жажда');mor(hungry?-8:-6)}
  S.rad=clamp(S.rad+radDelta(),0,100);
  if(S.rad>60&&Math.random()<(S.rad-60)/180*(1-L.med*.12-(has('leyla')?.15:0))){lose(1,'лучевая болезнь');mor(-4)}
  if(S.rad>80)mor(-2);
  let dm=(hungry||thirsty)?0:(R.food>S.pop*3&&R.water>S.pop*3?(S.morale<70?1:.2):-1);
  if(blackout)dm-=3;if(S.flags.dog)dm+=.5;
  mor(dm);
  S.pile=Math.min(S.pile+Math.max(0,S.pop-S.away-1)*1.1*(has('tamara')?1.2:1)*(S.morale<20?.5:1),25*Math.max(1,S.pop));
  for(const b of S.build.slice()){b.days--;if(b.days<=0){S.lv[b.id]++;S.build.splice(S.build.indexOf(b),1);log(`${RM[b.id].name}: уровень ${S.lv[b.id]}.`);snd(660)}}
  for(const x of S.sorties.slice()){x.left--;if(x.left<=0){resolveSortie(x);S.sorties.splice(S.sorties.indexOf(x),1)}}
  S.day++;
  checkEnd();
  if(!S.ended&&Math.random()<.55)pickEvent();
  save();refresh();
}
function resolveSortie(x){
  const d=SORT.find(s=>s.id===x.id);
  S.away=Math.max(0,S.away-d.party);
  const risk=Math.max(.02,d.risk-.03*S.lv.arms-.01*S.lv.med-(has('artem')?.06:0));
  let m=1;
  if(Math.random()<risk){
    if(Math.random()<.5&&S.pop>1){lose(1,`не вернулся с вылазки «${d.name}»`);m=.5;mor(-4)}
    else{log(`Вылазка «${d.name}»: вернулись ни с чем, едва ушли.`);mor(-1);return}
  }
  const sc=Math.round(rnd(d.scrap[0],d.scrap[1])*m*(has('artem')?1.15:1)),f=Math.round(rnd(d.food[0],d.food[1])*m),w=Math.round(rnd(d.water[0],d.water[1])*m);
  res('scrap',sc);res('food',f);res('water',w);
  let t=`Вылазка «${d.name}»: лом +${sc}`+(f?`, еда +${f}`:'')+(w?`, вода +${w}`:'')+'.';
  if(Math.random()<(d.pop||.05)&&room1()){join(1);t+=' По дороге взяли с собой человека.'}
  log(t);
}
function pickEvent(){
  const pool=EVENTS.filter(e=>S.day>=e.min&&(!e.if||e.if())&&(S.last[e.id]===undefined||S.day-S.last[e.id]>=(e.cd||10)));
  if(!pool.length)return;
  const ws=pool.map(e=>typeof e.w==='function'?e.w():(e.w||1));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
  for(;i<pool.length-1;i++){r-=ws[i];if(r<=0)break}
  S.ev=pool[i].id;evRes=null;snd(520);
}
function checkEnd(){
  if(S.ended)return;
  if(S.pop<=0)S.ended={t:'dead'};
  else if(S.morale<=0)S.ended={t:'riot'};
  else if(S.day>=END_DAY)S.ended={t:'win'};
}
function canUpgrade(id){
  const r=RM[id];if(!r||r.fixed)return{ok:false,why:''};
  const L=S.lv[id];
  if(L>=5)return{ok:false,why:'Максимальный уровень'};
  if(S.build.some(b=>b.id===id))return{ok:false,why:'Идёт ремонт'};
  if(S.build.length>=slots())return{ok:false,why:'Все бригады заняты'};
  if(S.res.scrap<cost(id))return{ok:false,why:`${cost(id)} лома · не хватает ${cost(id)-Math.floor(S.res.scrap)}`};
  return{ok:true};
}
function upgrade(id){
  const c=canUpgrade(id);if(!c.ok)return;
  const L=S.lv[id];S.res.scrap-=cost(id);S.build.push({id,days:DUR[L],total:DUR[L]});
  log(`${L===0?'Начали ремонт':'Начали улучшение'}: ${RM[id].name}.`);snd(400);save();refresh();
}
function sortieRisk(d){return Math.max(.02,d.risk-.03*S.lv.arms-.01*S.lv.med-(has('artem')?.06:0))}
function send(id){
  const d=SORT.find(s=>s.id===id);
  if(!d.unlock()||S.pop-S.away<d.party+1||S.res.power<d.power)return;
  S.res.power-=d.power;S.away+=d.party;S.sorties.push({id,left:d.days});S.stats.sorties++;
  log(`Отправили вылазку: ${d.name}.`);snd(480);save();refresh();
}

function fx(id,L){
  if(L<=0)return 'не работает';
  switch(id){
    case 'gen':return `энергия +${GEN[L]}/день`;
    case 'farm':return `еда +${FARM[L]}/день`;
    case 'water':return `вода +${WAT[L]}/день`;
    case 'home':return `мест: ${CAP[L]}`;

}
function renderSheet(){
  const sh=$('#sheet'),d=S.ev?EVENTS.find(e=>e.id===S.ev):null;
  if(!d||S.ended){sh.hidden=true;return}
  sh.hidden=false;
  const k=typeof d.who==='function'?d.who():d.who,c=CH[k],text=typeof d.text==='function'?d.text():d.text;
  let body;
  if(evRes!==null)body=`<div class="res">${esc(evRes)}</div><button class="ch go" data-act="evnext"><b>Дальше</b></button>`;
  else body=`<h2 class="ttl">${esc(d.title)}</h2><p class="say">${esc(text)}</p>`+d.ch.map((o,i)=>{const ok=!o.ok||o.ok();return `<button class="ch" data-ev="${i}" ${ok?'':'disabled'}><b>${esc(o.t)}</b>${o.h||!ok?`<small>${esc(o.h||'')}${ok?'':(o.h?' · ':'')+'сейчас недоступно'}</small>`:''}</button>`}).join('');
  $('#sheetCard').innerHTML=`<div class="who">${avatar(k,52)}<div><b>${c.n}</b><small>${c.r}</small></div></div>${body}`;
}
function renderEnd(){
  const el=$('#end');
  if(!S.ended){el.hidden=true;return}
  el.hidden=false;
  const e=S.ended;let h,p,stars='';
  const lvSum=MOD.reduce((a,id)=>a+S.lv[id],0);
  if(e.t==='win'){
    stars=S.pop>=50?'★★★':S.pop>=25?'★★☆':'★☆☆';
    h=S.pop>=50?'Бункер полон':'Колонна пришла';
    p=`На ${END_DAY}-й день на гребне показались фары. «Ковчег» забирает ${S.pop} ${man(S.pop)}. Свет в Тихой Бухте гасили последним.`;
  }else if(e.t==='riot'){h='Бунт';p='Люди перестали слушаться. Шлюз открыли изнутри. Бункер опустел раньше срока.'}
  else{h='Бункер пуст';p='Последний вышел на связь и не получил ответа. Тихая Бухта замолчала.'}
  $('#endCard').innerHTML=`${stars?`<div class="stars">${stars}</div>`:''}<h2>${h}</h2><p>${p}</p><div class="stats"><div><b>${S.day}</b><span>день</span></div><div><b>${S.pop}</b><span>выжило</span></div><div><b>${lvSum}/45</b><span>уровни модулей</span></div><div><b>${S.stats.lost}</b><span>потеряно</span></div></div><button class="ch go" data-act="restart"><b>Сыграть ещё</b></button>`;
}
function refresh(){renderHud();renderScene();renderDetail();renderAdvisor();renderActions();renderChips();renderTabs();renderSheet();renderEnd()}

/* ---------- input ---------- */
function newGame(){const s=S.snd;S=fresh();S.snd=s;evRes=null;confirmNew=false;tab='journal';$('#menu').hidden=true;save();refresh()}
function pick(i){
  const d=EVENTS.find(e=>e.id===S.ev),o=d&&d.ch[i];
  if(!o||(o.ok&&!o.ok()))return;
  const t=o.f();S.last[d.id]=S.day;snd(440);
  if(o.quiet){S.ev=null;evRes=null}
  else{evRes=t;log(`${d.title}. ${t}`)}
  checkEnd();save();refresh();
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');
  if(!t){if(!ev.target.closest('#menu'))$('#menu').hidden=true;return}
  if(t.id==='menuBtn'){$('#menu').hidden=!$('#menu').hidden;confirmNew=false;renderHud();return}
  if(t.id==='mSnd'||t.id==='sndBtn'){S.snd=!S.snd;snd(600);save();renderHud();return}
  if(t.id==='mNew'){if(confirmNew)newGame();else{confirmNew=true;renderHud()}return}
  if(t.id==='spd'){S.speed=S.speed===1?2:S.speed===2?4:S.speed===4?0:1;save();renderHud();return}
  if(t.id==='bCollect'){const n=Math.floor(S.pile);if(n>0){S.res.scrap+=n;S.pile-=n;snd(520);save();refresh()}return}
  if(t.id==='bUpg'){if(t.dataset.mode==='sort'){tab='sort';renderTabs();$('#tabs').scrollIntoView({behavior:'smooth',block:'start'})}else upgrade(S.sel);return}
  if(t.dataset.room){S.sel=t.dataset.room;snd(360);save();renderScene();renderDetail();renderAdvisor();renderActions();return}
  if(t.dataset.tab){tab=t.dataset.tab;renderTabs();return}
  if(t.dataset.send){send(t.dataset.send);return}
  if(t.dataset.ev!==undefined){pick(+t.dataset.ev);return}
  if(t.dataset.act==='evnext'){S.ev=null;evRes=null;save();refresh();return}
  if(t.dataset.act==='restart'){newGame();return}
});
window.addEventListener('resize',()=>requestAnimationFrame(placeWalker));

let last=performance.now();
setInterval(()=>{
  const n=performance.now(),dt=Math.min(500,n-last);last=n;
  if(!S.ended&&!S.ev&&S.speed){S.t+=dt*S.speed/DAY_MS;if(S.t>=1){S.t-=1;endDay()}}
  updateTick();
},100);

refresh();
})();
</script>
